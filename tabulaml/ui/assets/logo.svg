<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="TabulaML logo">
  <defs>
    <linearGradient id="tml-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8ef0"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tml-bg)"/>
  <!-- a data table: frame and header row -->
  <rect x="11" y="15" width="42" height="36" rx="6" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95"/>
  <line x1="11" y1="25" x2="53" y2="25" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95"/>
  <!-- rising bars inside the table: learning from the rows -->
  <rect x="17" y="38" width="7" height="8" rx="2" fill="#ffffff"/>
  <rect x="28.5" y="33" width="7" height="13" rx="2" fill="#ffffff"/>
  <rect x="40" y="29" width="7" height="17" rx="2" fill="#ffffff"/>
  <!-- the insight / prediction dot -->
  <circle cx="50" cy="13" r="6" fill="#ffb547" stroke="#184f95" stroke-width="2.5"/>
</svg>
