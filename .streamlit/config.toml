[server]
headless = true
maxUploadSize = 200
runOnSave = false

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false

# Separate light and dark themes keep Streamlit's System / Light / Dark picker in the
# top-right menu (a single [theme] section would remove it). Only the accent is changed.
[theme.light]
primaryColor = "#2a78d6"

[theme.dark]
primaryColor = "#3987e5"
